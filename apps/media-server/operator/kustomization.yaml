apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media-server

resources:
  - https://github.com/TorrentDam/operator//?ref=main

patches:
  - target:
      kind: ClusterRoleBinding
      name: torrentdam-operator
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: media-server